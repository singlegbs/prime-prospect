name: Update hero and refresh behavior
on: workflow_dispatch
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<p>Worldwide. Revenue Opportunity Sourcer. Better-targeted accounts, better-informed outreach, less time spent researching.</p><p id="pp-pilot-offer" style="margin-top:20px">Free 3-account sample in 48 hours. Then a 23-account Pilot for $79, including free samples.</p>'
          new='<h2 class="pp-hero-headline">Researched B2B accounts your team can contact today</h2><p class="pp-hero-description">I hand-research companies that match your ideal customer, find the right decision-makers, and verify every contact. Every claim comes with a source link.</p><div class="pp-hero-actions"><a class="pp-hero-button pp-hero-primary" href="#contact">Get 3 free accounts</a><a class="pp-hero-button pp-hero-secondary" href="#sample">See a sample</a></div><p class="pp-hero-caption">Free sample in 48 hours. No card needed. Works with teams and agencies worldwide.</p>'
          assert s.count(old)==1, 'Original hero not found exactly once'
          assert 'pp-hero-update' not in s and s.count('</head>')==1
          s=s.replace(old,new,1)
          extra='''<style id="pp-hero-update">.hero-copy .pp-hero-headline{font:700 clamp(32px,5vw,54px)/1.12 Poppins,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif;letter-spacing:-.035em;margin:22px 0 18px;max-width:760px}.hero-copy .pp-hero-description{font-size:clamp(17px,2vw,20px);line-height:1.55;max-width:690px;margin:0}.pp-hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 0}.pp-hero-button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border:1px solid var(--accent);border-radius:8px;font:600 14px/1.2 Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-decoration:none;transition:transform .2s ease,box-shadow .2s ease}.pp-hero-primary{background:var(--accent);color:var(--on-accent)}.pp-hero-secondary{background:transparent;color:var(--paper)}.pp-hero-button:hover,.pp-hero-button:focus-visible{transform:translateY(-2px);box-shadow:0 0 18px rgba(121,192,67,.25)}.hero-copy .pp-hero-caption{font-size:13px;line-height:1.5;margin:16px 0 0;max-width:650px}@media(max-width:767px){.hero-inner.wrap{padding-inline:24px!important}.pp-hero-button{padding-inline:16px;font-size:13px}}@media(prefers-reduced-motion:reduce){.pp-hero-button{transition:none}.pp-hero-button:hover,.pp-hero-button:focus-visible{transform:none}}</style><script id="pp-scroll-restoration">if('scrollRestoration' in history)history.scrollRestoration='manual';window.addEventListener('pageshow',function(){var n=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];if(n&&n.type==='reload'){var root=document.documentElement,prev=root.style.scrollBehavior;root.style.scrollBehavior='auto';window.scrollTo(0,0);requestAnimationFrame(function(){window.scrollTo(0,0);root.style.scrollBehavior=prev})}});</script>'''
          s=s.replace('</head>',extra+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update hero and refresh behavior'
          git push
