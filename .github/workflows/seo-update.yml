name: Add approved FAQ answers
on: workflow_dispatch
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add FAQ items and structured data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, html
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pairs = [
              ("What if the free sample isn't a fit?", "Tell me what missed the mark and I'll re-research the sample around it. The fit is the point of the free sample."),
              ("How do I pay?", "Through Whop's secure checkout. Card payment, and you get your delivery by email.")
          ]
          start = s.index('<section class="section" id="faq">')
          end = s.index('</section>', start) + len('</section>')
          section = s[start:end]
          assert section.count('<details class="pp-faq-item">') == 3
          assert all(q not in section for q, a in pairs)
          addition = ''.join('<details class="pp-faq-item"><summary>' + html.escape(q, quote=False) + '<span class="pp-faq-symbol" aria-hidden="true"></span></summary><p>' + html.escape(a, quote=False) + '</p></details>' for q, a in pairs)
          marker = '</div></div></section>'
          assert section.endswith(marker)
          section = section[:-len(marker)] + addition + marker
          s = s[:start] + section + s[end:]
          matches = list(re.finditer(r'<script type="application/ld\+json">(.*?)</script>', s, re.S))
          found = 0
          for m in reversed(matches):
              data = json.loads(m.group(1))
              nodes = data.get('@graph', [data])
              faqs = [node for node in nodes if node.get('@type') == 'FAQPage']
              if not faqs:
                  continue
              assert len(faqs) == 1 and len(faqs[0]['mainEntity']) == 3
              for q, a in pairs:
                  faqs[0]['mainEntity'].append({'@type':'Question','name':q,'acceptedAnswer':{'@type':'Answer','text':a}})
              new = json.dumps(data, ensure_ascii=False, separators=(',', ':'))
              s = s[:m.start(1)] + new + s[m.end(1):]
              found += 1
          assert found == 1
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit FAQ update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add approved FAQ answers and structured data'
          git push
