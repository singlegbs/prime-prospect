name: Add contact icons
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add accessible inline contact icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          assert s.count('id="contact"') == 1
          start=s.index('<section class="contact '); end=s.index('</section>', start)+len('</section>')
          section=s[start:end]
          envelope='<svg class="pp-contact-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
          xicon='<svg class="pp-contact-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path fill="currentColor" d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.4l7.9-9.1L2.7 2h6.4l4.5 6.9L18.9 2Zm-1.1 18h1.7L8.2 3.9H6.4L17.8 20Z"/></svg>'
          whatsapp='<svg class="pp-contact-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M20.5 11.8a8.5 8.5 0 0 1-12.8 7.3L3.5 20.3l1.2-4a8.5 8.5 0 1 1 15.8-4.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.7 7.7c.3-.3.7-.3 1-.1l1 1.5c.1.2.1.5-.1.7l-.5.6c.6 1.3 1.6 2.3 2.9 2.9l.6-.5c.2-.2.5-.2.7-.1l1.5 1c.3.2.3.6.1 1-.4.6-1.1.9-1.9.8-3.5-.7-6.4-3.6-7.1-7.1-.1-.7.2-1.2.8-1.7Z" fill="currentColor"/></svg>'
          replacements=[('>bright@primeprospect.net</a>', '>'+envelope+'bright@primeprospect.net</a>'),('>Follow Prime Prospect on X</a>', '>'+xicon+'Follow Prime Prospect on X</a>'),('>Contact Bright on WhatsApp</a>', '>'+whatsapp+'Contact Bright on WhatsApp</a>')]
          for old,new in replacements:
              assert section.count(old)==1, old
              section=section.replace(old,new,1)
          s=s[:start]+section+s[end:]
          css='<style id="pp-contact-icons">#contact .pp-contact-icon{width:22px;height:22px;flex:0 0 22px;margin-inline-end:10px;color:#173d10;transition:transform .22s ease,filter .22s ease}#contact .pill .pp-contact-icon{color:#b6f970}#contact a:hover .pp-contact-icon,#contact a:focus-visible .pp-contact-icon,#contact a:active .pp-contact-icon{transform:scale(1.08);filter:drop-shadow(0 0 5px rgba(92,164,52,.65))}@media (prefers-reduced-motion:reduce){#contact .pp-contact-icon{transition:none}#contact a:hover .pp-contact-icon,#contact a:focus-visible .pp-contact-icon,#contact a:active .pp-contact-icon{transform:none;filter:none}}</style>'
          assert s.count('</head>')==1 and 'id="pp-contact-icons"' not in s
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          print('Added email, X and WhatsApp icons at 22px with reduced-motion support.')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add subtle animated contact icons'
          git push
