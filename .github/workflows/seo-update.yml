name: Improve contact icon contrast
on: workflow_dispatch
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brighten dark theme icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert 'id="pp-contact-icons"' in s
          assert 'pp-contact-contrast' not in s and s.count('</head>') == 1
          css='<style id="pp-contact-contrast">html[data-theme="dark"] #contact .pp-contact-icon{color:#b6f970}</style>'
          s=s.replace('</head>',css+'</head>',1)
          for target in ['mailto:bright@primeprospect.net','https://x.com/Primeprospect__','https://wa.me/233538181600']:
              assert target in s
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Improve contact icon contrast in dark mode'
          git push
