name: Optimize website images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
      - name: Resize founder photo and generate icons
        run: |
          set -eu
          echo "Founder photo before: $(stat -c %s bright-founder.jpg) bytes"
          convert bright-founder.jpg -auto-orient -resize '800x800>' -strip -quality 84 bright-founder-optimized.jpg
          mv bright-founder-optimized.jpg bright-founder.jpg
          convert photo-7d50bfdf.jpg -auto-orient -resize 192x192 -strip favicon.png
          convert photo-7d50bfdf.jpg -auto-orient -resize 180x180 -strip apple-touch-icon.png
          python3 -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); old="<link rel=\"icon\" type=\"image/jpeg\" href=\"photo-7d50bfdf.jpg\"><link rel=\"apple-touch-icon\" href=\"photo-7d50bfdf.jpg\">"; new="<link rel=\"icon\" type=\"image/png\" href=\"favicon.png\"><link rel=\"apple-touch-icon\" href=\"apple-touch-icon.png\">"; assert old in s, "Original icon tags not found"; p.write_text(s.replace(old,new,1))'
          echo "Founder photo after: $(stat -c %s bright-founder.jpg) bytes"
          identify bright-founder.jpg favicon.png apple-touch-icon.png
      - name: Commit optimized images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bright-founder.jpg favicon.png apple-touch-icon.png index.html
          git commit -m 'Optimize founder photo and add PNG icons'
          git push origin HEAD:main
