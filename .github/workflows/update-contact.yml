name: Update contact email
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show contact address
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<a class="pill" href="mailto:bright@primeprospect.net">Email us</a>'
          new = '<a class="pill" href="mailto:bright@primeprospect.net">bright@primeprospect.net</a>'
          assert text.count(old) == 1, 'Unexpected contact link'
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show contact email address'
          git push
