name: Update contact email
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace contact address only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'briight.business@gmail.com'
          new = 'bright@primeprospect.net'
          n = text.count(old)
          print(f'Occurrences replaced: {n}')
          assert n == 8, f'Unexpected old email count: {n}'
          assert text.count('gmail.com') == n, 'Additional Gmail reference requires review'
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update contact email'
          git push
