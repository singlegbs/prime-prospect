name: Update page title
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set the browser and social title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<title>B2B Account Research Service | Prime Prospect</title>'
          assert s.count(old) == 1
          assert 'property="og:title"' not in s
          s = s.replace(old, '<title>Prime Prospect</title><meta property="og:title" content="Prime Prospect">', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use Prime Prospect as page title'
          git push
