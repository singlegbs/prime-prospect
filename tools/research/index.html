<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>PP Research Assistant</title><style>
:root{color-scheme:dark;--bg:#131417;--fg:#ece8e1;--panel:#202226;--muted:#b8babd;--line:#555960;--accent:#79c043;--button-text:#131417}html[data-theme=light]{color-scheme:light;--bg:#ece8e1;--fg:#131417;--panel:#f4f2ee;--muted:#595d65;--line:#a9aaa7;--accent:#286b1b;--button-text:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif}main{max-width:760px;margin:auto;padding:22px 18px 50px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{font-weight:750;letter-spacing:-.02em;color:inherit;text-decoration:none}.actions{display:flex;gap:16px;align-items:center}a,button.link{color:var(--fg)}button.link{font:inherit;background:none;border:0;padding:8px 0;text-decoration:underline;cursor:pointer}h1{font-size:clamp(28px,7vw,38px);line-height:1.15;letter-spacing:-.035em;margin:30px 0 16px}label{display:block;font-weight:650;margin:20px 0 7px}input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:14px;font:inherit}textarea{min-height:220px;resize:vertical}.hint{font-size:14px;color:var(--muted);margin:6px 0}.submit{min-height:50px;border:0;border-radius:10px;padding:12px 24px;background:var(--accent);color:var(--button-text);font:700 16px inherit;cursor:pointer;margin-top:20px}.submit:disabled{opacity:.6}#result{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;margin-top:24px}[hidden]{display:none!important}@media(max-width:480px){.submit{width:100%}}
</style></head><body><main><div class="bar"><a class="brand" href="/">PRIME PROSPECT</a><div class="actions"><button class="link" id="theme" type="button">Light / dark</button><button class="link" id="lock" type="button" hidden>Lock</button></div></div><h1>PP Research Assistant</h1><form id="form"><div id="pass-wrap"><label for="pass">Passphrase</label><input id="pass" type="password" autocomplete="current-password"><p class="hint">Remembered on this device after a successful request.</p></div><label for="looking">What I'm looking for</label><input id="looking" placeholder="paid-ad agencies, 5-50 staff, $2,500+/mo retainers"><p class="hint">Optional</p><label for="blurb">Paste a company's blurb, About page, or LinkedIn description</label><textarea id="blurb" required></textarea><button class="submit" id="go" type="submit">Analyze</button></form><div id="result" role="status" aria-live="polite"></div></main><script>
(function(){'use strict';const themeKey='prime-prospect-theme',passKey='pp-tools-passphrase',root=document.documentElement,pass=document.getElementById('pass'),wrap=document.getElementById('pass-wrap'),lock=document.getElementById('lock'),result=document.getElementById('result'),go=document.getElementById('go');let saved='';try{saved=localStorage.getItem(passKey)||'';const t=localStorage.getItem(themeKey);root.dataset.theme=t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){root.dataset.theme=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}function showLock(){wrap.hidden=!!saved;lock.hidden=!saved}showLock();document.getElementById('theme').onclick=function(){root.dataset.theme=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem(themeKey,root.dataset.theme)}catch(e){}};lock.onclick=function(){saved='';pass.value='';try{localStorage.removeItem(passKey)}catch(e){}showLock();result.textContent='Locked on this device.';pass.focus()};document.getElementById('form').addEventListener('submit',async function(e){e.preventDefault();const phrase=saved||pass.value;if(!phrase){result.textContent='Enter your passphrase.';return}const blurb=document.getElementById('blurb').value.trim();if(!blurb){result.textContent='Please paste a company description.';return}go.disabled=true;go.textContent='Analyzing…';result.textContent='Analyzing…';try{const r=await fetch('https://script.google.com/macros/s/AKfycbyb8i4Kze4vn5Nybjl8PnfcQa7BDdL_-26FIJ-x_k9HYq4qb_MT7E0G7TamUFHiMWTxZA/exec',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({passphrase:phrase,looking:document.getElementById('looking').value.trim(),blurb:blurb})});const data=await r.json();if(!data.ok){result.textContent=data.error||'Something went wrong, try again';if(/wrong or missing passphrase/i.test(result.textContent)){saved='';try{localStorage.removeItem(passKey)}catch(e){}showLock()}return}saved=phrase;try{localStorage.setItem(passKey,phrase)}catch(e){}pass.value='';showLock();result.textContent=(data.result&&data.result.text)||'Something went wrong, try again'}catch(err){result.textContent='Unable to connect. Please try again.'}finally{go.disabled=false;go.textContent='Analyze'}})})();
</script></body></html>
