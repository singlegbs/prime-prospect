<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>PP Email Finder</title><style>
:root{color-scheme:dark;--bg:#131417;--fg:#ece8e1;--panel:#202226;--muted:#b8babd;--line:#555960;--accent:#79c043;--button-text:#131417}html[data-theme=light]{color-scheme:light;--bg:#ece8e1;--fg:#131417;--panel:#f4f2ee;--muted:#595d65;--line:#a9aaa7;--accent:#286b1b;--button-text:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif}main{max-width:760px;margin:auto;padding:22px 18px 50px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{font-weight:750;letter-spacing:-.02em;color:inherit;text-decoration:none}.actions{display:flex;gap:16px;align-items:center}a,button.link{color:var(--fg)}button.link{font:inherit;background:none;border:0;padding:8px 0;text-decoration:underline;cursor:pointer}h1{font-size:clamp(28px,7vw,38px);line-height:1.15;letter-spacing:-.035em;margin:30px 0 12px}label{display:block;font-weight:650;margin:20px 0 7px}input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:14px;font:inherit}.hint{font-size:14px;color:var(--muted);margin:6px 0}.submit{min-height:50px;border:0;border-radius:10px;padding:12px 24px;background:var(--accent);color:var(--button-text);font:700 16px inherit;cursor:pointer;margin-top:20px}.submit:disabled{opacity:.6}#status{white-space:pre-wrap;margin-top:24px}.result{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px;margin:12px 0;overflow-wrap:anywhere}.address{font-weight:700}.badge{font-size:13px;color:var(--muted);margin-left:8px}.source{display:block;margin-top:8px;font-size:14px;overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:480px){.submit{width:100%}}
</style></head><body><main><div class="bar"><a class="brand" href="/">PRIME PROSPECT</a><div class="actions"><button class="link" id="theme" type="button">Light / dark</button><button class="link" id="lock" type="button" hidden>Lock</button></div></div><h1>PP Email Finder</h1><p>Find emails published on a company’s website, with their source pages. No guessing.</p><form id="form"><div id="pass-wrap"><label for="pass">Passphrase</label><input id="pass" type="password" autocomplete="current-password"><p class="hint">Remembered on this device after a successful request.</p></div><label for="url">Company website URL</label><input id="url" type="text" inputmode="url" autocapitalize="none" autocorrect="off" placeholder="example.com" required><button class="submit" id="go" type="submit">Find emails</button></form><div id="status" role="status" aria-live="polite"></div><div id="results"></div><p class="hint">Up to 50 searches per day, resetting at midnight in Abidjan. Results are limited to pages fetched; labels are approximate.</p></main><script>
(function(){'use strict';const themeKey='prime-prospect-theme',passKey='pp-tools-passphrase',root=document.documentElement,pass=document.getElementById('pass'),wrap=document.getElementById('pass-wrap'),lock=document.getElementById('lock'),status=document.getElementById('status'),out=document.getElementById('results'),go=document.getElementById('go');let saved='';try{saved=localStorage.getItem(passKey)||'';const t=localStorage.getItem(themeKey);root.dataset.theme=t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){root.dataset.theme=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}function showLock(){wrap.hidden=!!saved;lock.hidden=!saved}showLock();document.getElementById('theme').onclick=function(){root.dataset.theme=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem(themeKey,root.dataset.theme)}catch(e){}};lock.onclick=function(){saved='';pass.value='';try{localStorage.removeItem(passKey)}catch(e){}showLock();out.textContent='';status.textContent='Locked on this device.';pass.focus()};document.getElementById('form').addEventListener('submit',async function(e){e.preventDefault();const phrase=saved||pass.value,url=document.getElementById('url').value.trim();out.textContent='';if(!phrase){status.textContent='Enter your passphrase.';return}if(!url){status.textContent='Please enter a company website URL.';return}go.disabled=true;go.textContent='Searching…';status.textContent='Searching public pages…';try{const r=await fetch('https://script.google.com/macros/s/AKfycbwmxXGnVfbp8Ts-ad6A9x494rxziBP-FsKaNZwLsYRLSKg4jHmd8PTzfP16YxDRxoFC/exec',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({passphrase:phrase,url:url})});const data=await r.json();if(!data.ok){status.textContent=data.error||'Something went wrong. Please try again.';if(/wrong or missing passphrase/i.test(status.textContent)){saved='';try{localStorage.removeItem(passKey)}catch(e){}showLock()}return}saved=phrase;try{localStorage.setItem(passKey,phrase)}catch(e){}pass.value='';showLock();const d=data.result;if(!d.results.length){status.textContent='No published emails found on that site.'}else{status.textContent=d.results.length+' email'+(d.results.length===1?'':'s')+' found on '+d.pages+' page'+(d.pages===1?'':'s')+'.';d.results.forEach(function(x){const card=document.createElement('div'),address=document.createElement('span'),badge=document.createElement('span'),source=document.createElement('a');card.className='result';address.className='address';address.textContent=x.email;badge.className='badge';badge.textContent=x.category;source.className='source';source.textContent=x.url;try{const u=new URL(x.url);if(u.protocol==='https:'||u.protocol==='http:'){source.href=u.href;source.target='_blank';source.rel='noopener noreferrer'}}catch(e){}card.append(address,badge,source);out.appendChild(card)})}if(d.incomplete)status.textContent+=' Some candidate pages could not be checked or the fetch limit was reached.'}catch(err){status.textContent='Unable to connect. Please try again.'}finally{go.disabled=false;go.textContent='Find emails'}})})();
</script></body></html>
